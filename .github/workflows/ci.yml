name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Run examples
        run: |
          cargo run --release --example motif_section3
          cargo run --release --example gaussian_resampling
          cargo run --release --example paper_math
      - name: CLI smoke test
        run: cargo run --release -- mul deadbeef cafe
